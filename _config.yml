# Site settings
title: Dr. Fabio Ellger
email: fabio.ellger@wzb.eu
description: >- 
  Research Fellow  
twitter_username: fabioellger
github_username: fabioellger
minimal_mistakes_skin: air #alternative is 'contrast'
search: false

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
permalink: /:categories/:title/
paginate: 0 # amount of posts to show

include:
  - _pages

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jemoji
  - jekyll-include-cache

# Author information
author:
  name   : "Dr. Fabio Ellger"
  avatar : "/assets/images/Foto_Ellger.png"
  bio    : "Postdoctoral Research Fellow\nTransformations of Democracy Unit\nWZB Berlin Social Science Center\nfabio.ellger[at]wzb.eu"
  links:
    - label: "CV"
      icon: "fas fa-file"
      url: "/assets/docs/cv.pdf"
    - label: "Twitter"
      icon: "fab fa-twitter"
      url: "https://twitter.com/fabioellger"
    - label: "Bluesky"
      icon: "fab fa-bluesky"
      url: "https://bsky.app/profile/fabioellger.bsky.social"
    - label: "LinkedIn"
      icon: "fab fa-linkedin"
      url: "https://de.linkedin.com/in/fabio-ellger-755255383/de"

# Footer
footer:
  links:
    - label: "Twitter"
      icon: "fab fa-twitter"
      url: "https://twitter.com/fabioellger"

# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      read_time: false
      comments: false
      share: false
      related: false
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
      read_time: false
      comments: false
      share: false
      related: false
